<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasyl Pulse</title>
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/icon16.png">
    <link rel="icon" type="image/png" sizes="48x48" href="../icons/icon48.png">
    <link rel="icon" type="image/png" sizes="128x128" href="../icons/icon128.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <div>
            <div class="logo">DASYL PULSE</div>
            <p style="font-size: 9px; color: var(--text-dim); margin-top: 2px;">Runtime Intelligence</p>
        </div>
        <div id="statusBadge" class="status-badge status-excellent">Active</div>
    </div>

    <div class="site-info" style="padding: 10px 15px; border-bottom: 1px solid var(--border-color);">
        <div style="font-size: 10px; color: var(--text-dim); text-transform: uppercase;">Current Site</div>
        <div id="currentUrl" style="font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; color: #fff;">--</div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Total Requests</div>
            <div id="totalRequests" class="stat-value">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Failed (500s)</div>
            <div id="failedRequests" class="stat-value" style="color: #ff3366;">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Slow (>1s)</div>
            <div id="slowRequests" class="stat-value" style="color: #ffaa00;">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Avg API Time</div>
            <div id="avgTime" class="stat-value">--</div>
        </div>
    </div>

    <div class="section-title">
        <span>SMART WARNINGS</span>
    </div>
    <div id="warningsList" class="warnings-list" style="padding: 0 15px; max-height: 100px; overflow-y: auto;">
        <!-- Warnings will be injected here -->
        <div style="font-size: 11px; color: var(--text-dim); padding: 5px 0;">No active warnings.</div>
    </div>

    <div class="section-title">
        <span>REQUEST HISTORY (LAST 100)</span>
    </div>
    <div id="historyList" class="history-list">
        <!-- History items will be injected here -->
    </div>

    <div class="controls">
        <div class="toggle-container">
            <span>Dev Mode Interception</span>
            <label class="switch">
                <input type="checkbox" id="devModeToggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
