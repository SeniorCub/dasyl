<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasyl Pulse</title>
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/icon16.png">
    <link rel="icon" type="image/png" sizes="48x48" href="../icons/icon48.png">
    <link rel="icon" type="image/png" sizes="128x128" href="../icons/icon128.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <div>
            <div class="logo">DASYL PULSE</div>
            <p style="font-size: 9px; color: var(--text-dim); margin-top: 2px;">See your network like a developer.</p>
        </div>
        <div id="statusBadge" class="status-badge status-excellent">Excellent</div>
    </div>

    <div class="meter-container">
        <svg class="progress-ring" width="180" height="180">
            <circle class="progress-ring__background" stroke="rgba(255,255,255,0.05)" stroke-width="8" fill="transparent" r="80" cx="90" cy="90"/>
            <circle id="progressCircle" class="progress-ring__circle" stroke="url(#gradient)" stroke-width="8" stroke-dasharray="502.6" stroke-dashoffset="502.6" fill="transparent" r="80" cx="90" cy="90"/>
            <defs>
                <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#39ff14" />
                    <stop offset="100%" stop-color="#00e5ff" />
                </linearGradient>
            </defs>
        </svg>
        <div id="speedDisplay" class="speed-value">0.0</div>
        <div class="speed-unit">Mbps Download</div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Latency (Unloaded)</div>
            <div id="latencyUnloadedDisplay" class="stat-value">--</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Latency (Loaded)</div>
            <div id="latencyLoadedDisplay" class="stat-value">--</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Upload</div>
            <div id="uploadDisplay" class="stat-value">--</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Jitter</div>
            <div id="jitterDisplay" class="stat-value">--</div>
        </div>
    </div>

    <div class="client-info" id="clientInfo">
        <div class="info-row">
            <span>IP:</span>
            <span id="clientIP">--</span>
        </div>
        <div class="info-row">
            <span>Provider:</span>
            <span id="clientProvider">--</span>
        </div>
        <div class="info-row">
            <span>Location:</span>
            <span id="clientLocation">--</span>
        </div>
        <div class="info-row">
            <span>Server:</span>
            <span id="serverInfo">Cloudflare CDN</span>
        </div>
    </div>

    <div class="section-title">
        <span>HISTORY</span>
    </div>
    <div id="historyList" class="history-list">
        <!-- History items will be injected here -->
    </div>

    <div class="controls">
        <div class="toggle-container">
            <span>Dev Mode</span>
            <label class="switch">
                <input type="checkbox" id="devModeToggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <button id="runTestBtn" class="btn-primary">RUN SPEED TEST</button>

    <script src="popup.js"></script>
</body>
</html>
